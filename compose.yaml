x-web: &web
  build: ./web
  restart: unless-stopped
  environment:
    - PORT=3000
    - DB_HOST=postgres
    - DB_USER=${POSTGRES_USER}
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_NAME=${POSTGRES_DB}
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    start_period: 30s
    start_interval: 2s
    interval: 30s
    timeout: 5s
    retries: 3
  networks:
    - app-network

services:
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      start_period: 10s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  postgres:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 30s
      start_interval: 2s
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  web1:
    <<: *web
    container_name: node_webserver_1

  web2:
    <<: *web
    container_name: node_webserver_2

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      app-network:
        ipv4_address: 172.20.0.2

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          # Automatic addresses come from the upper half, so none can take .2.
          ip_range: 172.20.0.128/25
