# Serves the built React app. Only the proxy nginx talks to this container;
# rate limiting and security headers are handled there.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Built JS/CSS have a content hash in the filename (index-BYJqj2RK.js),
    # so a given file never changes and browsers can keep it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Any other path: send the file if it exists, otherwise index.html so
    # React can handle routes like /advertisers. no-cache makes browsers
    # re-check index.html, so they pick up new asset hashes after a deploy.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
